<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>운영 에이전트 채팅 (Vue)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #1e1e2e; color: #e2e2f0;
    overflow: hidden;   /* #log만 스크롤되게, 바디 자체는 늘어나지 않게 고정 */
  }
  #app {
    flex: 1; min-height: 0;   /* Vue 마운트 루트가 header/#log/form을 감싸므로,
                                 body의 flex 흐름이 여기까지 이어지게 한다 */
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: #262638; border-bottom: 1px solid #3a3a52;
    font-weight: 600; font-size: 15px;
  }
  header span { color: #8b8bd8; font-weight: 400; font-size: 13px; margin-left: 8px; }
  #log {
    flex: 1; min-height: 0;   /* flex 자식 기본 최소높이(콘텐츠 크기)를 풀어줘야
                                 내용이 길어져도 바디가 안 늘어나고 여기서만 스크롤됨 */
    overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: #3a3a52; border-radius: 6px; }
  #log::-webkit-scrollbar-thumb:hover { background: #4a4a68; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
    font-size: 14px; white-space: pre-wrap;
  }
  .row.user .bubble { background: #5b5bd6; color: white; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: #2e2e42; border-bottom-left-radius: 4px; }
  .steps {
    max-width: 70%; font-size: 12px; color: #9a9ac0; padding: 6px 14px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .steps .step::before { content: "⏳ "; }
  .steps .step.done::before { content: "✓ "; color: #7ee787; }
  .prompt-box {
    flex-shrink: 0;   /* #log가 스크롤 영역이 되면서(min-height:0) <details>가 flex
                         자식으로서 내용 없이 찌그러지는 걸 방지 */
    max-width: 70%; margin-top: -4px; background: #17171f; border: 1px solid #3a3a52;
    border-radius: 10px; font-size: 12px; overflow: hidden;
  }
  .prompt-box summary {
    cursor: pointer; padding: 7px 12px; color: #8b8bd8; user-select: none;
    list-style: none;
  }
  .prompt-box summary::-webkit-details-marker { display: none; }
  .prompt-box summary::before { content: "🔍 "; }
  .prompt-box[open] summary::before { content: "🔽 "; }
  .prompt-box pre {
    margin: 0; padding: 10px 12px; border-top: 1px solid #3a3a52;
    background: #11111a; color: #c3c3e0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; max-height: 320px; overflow-y: auto;
  }
  form { display: flex; gap: 8px; padding: 14px 20px; background: #262638; border-top: 1px solid #3a3a52; }
  input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #3a3a52;
    background: #1e1e2e; color: #e2e2f0; font-size: 14px;
  }
  input:focus { outline: 1px solid #5b5bd6; }
  button {
    padding: 11px 20px; border-radius: 10px; border: none; background: #5b5bd6;
    color: white; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #3a3a52; cursor: default; }
  header label { float: right; font-weight: 400; font-size: 13px; color: #c3c3e0; cursor: pointer; }
  header label input { flex: none; padding: 0; margin: 0 4px 0 0; vertical-align: -1px; }
  .approval {
    flex-shrink: 0; max-width: 70%; background: #2b2417; border: 1px solid #8a6a2a;
    border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5;
  }
  .approval .title { font-weight: 600; color: #f0c674; margin-bottom: 6px; }
  .approval ul { margin: 0 0 10px; padding-left: 18px; color: #e6dcc6; }
  .approval .actions { display: flex; gap: 8px; align-items: center; }
  .approval .actions input { padding: 7px 10px; font-size: 13px; }
  .approval .actions button { padding: 7px 14px; font-size: 13px; }
  .approval button.reject { background: #8a3a3a; }
  .approval .decided { color: #c3c3e0; }
</style>
</head>
<body>
<div id="app">
  <header>운영 인시던트 대응 에이전트 <span>{{ backendLabel }}</span>
    <label title="재시작·롤백 같은 조치가 든 답변은 담당자 승인 후 내보낸다"><input type="checkbox" v-model="hitl" />사람 승인</label>
  </header>
  <div id="log" ref="logEl">
    <template v-for="item in log" :key="item.id">
      <div v-if="item.kind === 'user'" class="row user">
        <div class="bubble">{{ item.text }}</div>
      </div>

      <div v-else-if="item.kind === 'steps'" class="steps">
        <div v-for="(step, i) in item.steps" :key="i" class="step">{{ step }}</div>
      </div>

      <div v-else-if="item.kind === 'agent'" class="row agent">
        <div class="bubble">{{ item.text }}</div>
      </div>

      <div v-else-if="item.kind === 'approval'" class="approval">
        <div class="title">⚠️ 담당자 승인이 필요한 조치{{ item.round ? ' (다시 쓴 안)' : '' }}</div>
        <ul><li v-for="(a, i) in item.actions" :key="i">{{ a }}</li></ul>
        <div v-if="!item.decided" class="actions">
          <input v-model="item.comment" placeholder="거부 사유 (선택)" />
          <button :disabled="sending" @click="decide(item, true)">승인</button>
          <button class="reject" :disabled="sending" @click="decide(item, false)">거부</button>
        </div>
        <div v-else class="decided">{{ item.decided }}</div>
      </div>

      <details v-else-if="item.kind === 'prompt'" class="prompt-box">
        <summary>LLM에 전달된 최종 프롬프트 보기</summary>
        <pre>{{ item.text }}</pre>
      </details>
    </template>
  </div>
  <form @submit.prevent="onSubmit">
    <input
      v-model="input"
      autocomplete="off"
:placeholder="awaitingApproval ? '위 승인 카드에서 승인 또는 거부를 먼저 선택하세요' : '예: auth-service 로그인 응답이 느려졌어요. 원인 확인해주세요'"
    />
    <button type="submit" :disabled="sending || awaitingApproval">보내기</button>
  </form>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive, nextTick } = Vue;

// runbook 선택기가 설정한 방식 대신 다른 방식으로 고른 이유 (RunbookSelected.reason)
const FALLBACK_NOTES = {
  'low-score': 'RAG 점수가 낮아 키워드 규칙으로 대체',
  'degraded': '임베딩 서버 장애로 BM25 순위만 사용',
  'no-hit': 'RAG 검색 결과가 없어 키워드 규칙으로 대체',
  'replan': '재계획 — 키워드 규칙으로 다시 선택',
};

const STEP_LABELS = {
  PlanCreated: e => `계획 수립: 할 일 ${e.task_count}가지${e.targets?.length ? ` (시스템: ${e.targets.join(', ')})` : ''}`,
  GateApplied: e => e.removed_analysis_tasks ? `불필요한 작업 ${e.removed_analysis_tasks}건 제거` : null,
  TaskCompleted: e => (e.source === 'monitoring'
      ? `모니터링 지표 확인 (시스템: ${e.target})`
      : `대응 매뉴얼(runbook) 조회 (장애유형: ${e.target}${e.systems?.length ? ` ← ${e.systems.join(', ')}` : ''})`)
      + (e.retries ? ' (재시도 성공)' : ''),
  RunbookSelected: e => {
    if (!e.incident_type) return `runbook 선택 실패: ${e.system}${e.reason ? ` (${e.reason})` : ''}`;
    const score = e.score != null ? `, 점수 ${e.score.toFixed(2)}` : '';
    const note = e.fallback ? ` — ${FALLBACK_NOTES[e.reason] || '키워드 규칙으로 대체'}` : '';
    // 1·2위 cosine 차가 0.01 미만이면 근소 — 선택은 그대로 두고 사람이 확인하도록 표시만 한다
    const close = e.margin != null && e.margin < 0.01 ? ` — 1·2위 차 ${e.margin.toFixed(4)}, 근소` : '';
    return `runbook 선택: ${e.system} → ${e.incident_type} (${e.method}${score})${note}${close}`;
  },
  // reason = '모든 시스템 정상' 또는 '모니터링에 없는 시스템' (systems에 해당 시스템)
  RunbookSkipped: e => `${e.reason || '모든 시스템 정상'}${e.systems?.length ? `(${e.systems.join(', ')})` : ''} — runbook 생략`,
  RunbookShared: e => `이미 읽은 runbook 공유: ${e.target} ← ${e.systems.join(', ')}`,
  RunbookReadFailed: e => `runbook 조회 실패: ${e.target} (${e.systems.join(', ')})`,
  ReplanCheck: e => {
    if (e.is_sufficient) return null;
    const targets = [].concat(e.target || []).join(', ');   // 개선 후 target은 시스템 목록
    return `runbook 없는 시스템(${targets}) → 다시 조사 (선택 실패는 키워드 규칙, 조회 실패는 재조회)`;
  },
  DraftWritten: e => `답변 초안 작성 (시도 ${e.attempt})`,
  Validation: e => e.verdict === '합격' ? '검수 통과' : '검수 반려 → 다시 작성',
  ApprovalSkipped: () => '위험 조치 없음 — 승인 생략',
  ApprovalDecision: e => e.approved ? '담당자 승인'
      : (e.rewrite ? '담당자 거부 → 그 조치를 빼고 다시 작성' : '담당자 거부 → 보류 표시 후 완성'),
  Finalize: () => '최종 답변 완성',
};

createApp({
  setup() {
    const backendLabel = ref('incident_rag_agent');
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const hitl = ref(true);   // 사람 승인 단계 (헤더 체크박스)
    const awaitingApproval = ref(false);   // 승인 카드가 결정을 기다리는 동안 새 질문을 막는다
    const logEl = ref(null);
    const thread = 't-web-' + Math.random().toString(36).slice(2, 8);
    let nextId = 0;

    fetch('/health').then(r => r.json()).then(h => {
      const selector = h.runbook_selector
        ? ` · runbook 선택기: ${h.runbook_selector}${h.rag_min_score != null ? ` (min ${h.rag_min_score})` : ''}`
        : '';
      backendLabel.value = `${h.llm_backend} 실모델(${h.fast_llm}/${h.quality_llm})${selector}`;
    }).catch(() => {});

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    // SSE 한 줄기를 처리한다 — 새 질문과 승인 후 재개가 같이 쓴다.
    // carry: 재개할 때 이어 쓸 말풍선(승인이면 초안 말풍선이 그대로 최종 답변이 된다)
    function runStream(url, stepsItem, carry = {}) {
      const es = new EventSource(url);
      let streamItem = carry.item || null;
      let streamAttempt = carry.attempt ?? null;   // write_node 재작성(attempt 증가) 시 새 말풍선으로 끊는다
      let ended = false;
      let askedApproval = false;

      // retryable: 서버가 승인 대기를 되돌려 놨다(같은 카드로 다시 시도) / 아니면 카드는 만료
      function fail(text, retryable) {
        log.value.push({ id: nextId++, kind: 'agent', text: `⚠ ${text}` });
        if (retryable) carry.onFail?.(); else carry.onExpire?.();
        scrollToBottom();
      }

      es.onmessage = (event) => {
        if (event.data === '[DONE]') {
          ended = true;
          es.close();
          sending.value = false;
          awaitingApproval.value = awaitingApproval.value || askedApproval;
          return;
        }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }

        if (e.type === 'AnswerToken') {
          if (!streamItem || streamAttempt !== e.attempt) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
            streamAttempt = e.attempt;
          }
          streamItem.text += e.delta;
          scrollToBottom();
          return;
        }

        if (e.type === 'Error') {
          fail(`실행 중 오류: ${e.detail || e.status || ''}${e.retry_run_id ? ' — 승인 카드에서 다시 시도할 수 있습니다' : ''}`,
               !!e.retry_run_id);
          return;
        }

        if (e.type === 'ApprovalRequired') {
          askedApproval = true;
          log.value.push(reactive({ id: nextId++, kind: 'approval', run_id: e.run_id,
            actions: e.actions || [], round: e.round || 0, comment: '', decided: '',
            carry: { item: streamItem, attempt: streamAttempt } }));
          scrollToBottom();
          return;
        }

        if (e.type === 'FinalAnswer') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          streamItem.text = e.reply;   // 토큰 합산 결과와 서버의 최종 텍스트를 일치시킨다
          if (e.prompt) log.value.push({ id: nextId++, kind: 'prompt', text: e.prompt });
          streamItem = null;
          streamAttempt = null;
          scrollToBottom();
          return;
        }

        const fn = STEP_LABELS[e.type];
        if (!fn) return;
        const label = fn(e);
        if (!label) return;
        stepsItem.steps.push(label);
        scrollToBottom();
      };

      es.onerror = () => {
        es.close();
        sending.value = false;
        if (!ended) fail('실행을 이어 가지 못했습니다 (연결 끊김 또는 서버 재시작). 다시 질문해 주세요.', false);
      };
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text || sending.value || awaitingApproval.value) return;

      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      scrollToBottom();

      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      scrollToBottom();

      runStream(`/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(thread)}`
        + (hitl.value ? '&hitl=true' : ''), stepsItem);
    }

    function decide(item, approved) {
      if (sending.value || item.decided) return;   // 두 번 눌러 스트림이 둘 뜨는 것 방지
      item.decided = approved ? '✓ 승인함' : `✕ 거부함${item.comment ? ` (사유: ${item.comment})` : ''}`;
      awaitingApproval.value = false;
      sending.value = true;
      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      scrollToBottom();
      runStream(`/chat/resume?run_id=${encodeURIComponent(item.run_id)}&approved=${approved}`
        + `&comment=${encodeURIComponent(item.comment || '')}`, stepsItem,
        { ...item.carry,
          onFail: () => { item.decided = ''; awaitingApproval.value = true; },
          onExpire: () => { item.decided = '만료됨 — 다시 질문해 주세요'; awaitingApproval.value = false; } });
    }

    return { backendLabel, log, input, sending, logEl, hitl, awaitingApproval, onSubmit, decide };
  },
}).mount('#app');
</script>
</body>
</html>
